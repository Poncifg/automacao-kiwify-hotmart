<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automação Kiwify & Hotmart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .status-card {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }
    
    .status-card h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    .status-value {
      color: #667eea;
      font-size: 24px;
      font-weight: bold;
    }
    
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #764ba2;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .log {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #333;
    }
    
    .log-entry {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-success {
      color: #27ae60;
    }
    
    .log-error {
      color: #e74c3c;
    }
    
    .log-info {
      color: #3498db;
    }
    
    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Automação Kiwify & Hotmart</h1>
    <p class="subtitle">Painel de Controle - Sistema Automático de Vendas</p>
    
    <div class="status-grid">
      <div class="status-card">
        <h3>Status API</h3>
        <div class="status-value" id="status">✓ Online</div>
      </div>
      <div class="status-card">
        <h3>Produtos Kiwify</h3>
        <div class="status-value" id="kiwifyCount">-</div>
      </div>
      <div class="status-card">
        <h3>Produtos Hotmart</h3>
        <div class="status-value" id="hotmartCount">-</div>
      </div>
    </div>
    
    <div class="actions">
      <button onclick="syncProducts()">Sincronizar</button>
      <button onclick="getKiwifyProducts()">Kiwify</button>
      <button onclick="getHotmartProducts()">Hotmart</button>
      <button onclick="generateMarketing()">Marketing</button>
    </div>
    
    <div class="log" id="log">
      <div class="log-entry log-info">Sistema iniciado e pronto para usar...</div>
    </div>
  </div>

  <script>
    const log = document.getElementById('log');
    
    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }
    
    async function syncProducts() {
      addLog('Sincronizando produtos...', 'info');
      try {
        const response = await fetch('/api/products');
        const data = await response.json();
        
        if (data.ok) {
          addLog(`Kiwify: ${data.kiwify.total} produtos`, 'success');
          addLog(`Hotmart: ${data.hotmart.total} produtos`, 'success');
          document.getElementById('kiwifyCount').textContent = data.kiwify.total;
          document.getElementById('hotmartCount').textContent = data.hotmart.total;
        } else {
          addLog('Erro na sincronização', 'error');
        }
      } catch (error) {
        addLog(`Erro: ${error.message}`, 'error');
      }
    }
    
    async function getKiwifyProducts() {
      addLog('Buscando produtos Kiwify...', 'info');
      try {
        const response = await fetch('/api/products/kiwify');
        const data = await response.json();
        
        if (data.ok) {
          addLog(`${data.total} produtos encontrados`, 'success');
        } else {
          addLog(`Erro: ${data.message}`, 'error');
        }
      } catch (error) {
        addLog(`Erro: ${error.message}`, 'error');
      }
    }
    
    async function getHotmartProducts() {
      addLog('Buscando produtos Hotmart...', 'info');
      try {
        const response = await fetch('/api/products/hotmart');
        const data = await response.json();
        
        if (data.ok) {
          addLog(`${data.total} produtos encontrados`, 'success');
        } else {
          addLog(`Erro: ${data.message}`, 'error');
        }
      } catch (error) {
        addLog(`Erro: ${error.message}`, 'error');
      }
    }
    
    async function generateMarketing() {
      addLog('Gerando campanha de marketing...', 'info');
      try {
        const response = await fetch('/api/marketing');
        const data = await response.json();
        
        if (data.ok) {
          addLog(`📝 Copy: ${data.campaign.marketingCopy}`, 'success');
          addLog(`🎯 Canais: ${data.campaign.channels.join(', ')}`, 'success');
        } else {
          addLog('Erro ao gerar marketing', 'error');
        }
      } catch (error) {
        addLog(`Erro: ${error.message}`, 'error');
      }
    }
    
    // Auto-sync ao carregar
    window.addEventListener('load', () => {
      addLog('Painel carregado com sucesso!', 'success');
      syncProducts();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automação Kiwify + Hotmart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 24px;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px;
    }

    .badge {
      display: inline-block;
      background: rgba(124,58,237,0.18);
      color: #c4b5fd;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .value {
      font-size: 2rem;
      font-weight: 800;
      margin: 8px 0;
      color: #f8fafc;
    }

    .btn {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
    }

    form {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px;
      margin-top: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #0b1120;
      color: white;
      margin-bottom: 16px;
    }

    .result {
      margin-top: 20px;
      background: rgba(15, 118, 110, 0.12);
      border: 1px solid rgba(45,212,191,0.3);
      border-radius: 12px;
      padding: 16px;
      color: #ccfbf1;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Automação Kiwify + Hotmart</div>
      <button class="btn" onclick="syncData()">Sincronizar</button>
    </div>

    <div class="grid">
      <div class="card">
        <div class="badge">Kiwify</div>
        <div class="value" id="kiwifyCount">0</div>
        <div>Produtos disponíveis</div>
      </div>
      <div class="card">
        <div class="badge">Hotmart</div>
        <div class="value" id="hotmartCount">0</div>
        <div>Produtos disponíveis</div>
      </div>
      <div class="card">
        <div class="badge">Marketing</div>
        <div class="value" id="marketingStatus">Pronto</div>
        <div>Campanhas preparadas</div>
      </div>
    </div>

    <form id="offerForm">
      <h2>Criar oferta</h2>
      <label>Nome da oferta</label>
      <input type="text" id="offerName" placeholder="Ex: Venda Automática com IA" required />

      <label>URL do produto</label>
      <input type="text" id="productUrl" placeholder="https://" required />

      <label>Canal de venda</label>
      <select id="salesChannel" multiple>
        <option value="Kiwify">Kiwify</option>
        <option value="Hotmart">Hotmart</option>
        <option value="Instagram">Instagram</option>
        <option value="WhatsApp">WhatsApp</option>
      </select>

      <button class="btn" type="submit">Salvar oferta</button>
    </form>

    <div class="result" id="resultBox"></div>
  </div>

  <script>
    async function syncData() {
      try {
        const response = await fetch('/api/products');
        const data = await response.json();

        document.getElementById('kiwifyCount').textContent = data.kiwify?.ok ? '1' : '0';
        document.getElementById('hotmartCount').textContent = data.hotmart?.ok ? '1' : '0';
        document.getElementById('marketingStatus').textContent = 'Gerado';
      } catch (error) {
        document.getElementById('marketingStatus').textContent = 'Erro';
      }
    }

    document.getElementById('offerForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const formData = {
        offerName: document.getElementById('offerName').value,
        productUrl: document.getElementById('productUrl').value,
        salesChannel: Array.from(document.getElementById('salesChannel').selectedOptions).map(opt => opt.value)
      };

      const response = await fetch('/api/offers', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });

      const result = await response.json();
      const box = document.getElementById('resultBox');
      box.style.display = 'block';
      box.textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
